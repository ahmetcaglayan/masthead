<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="96" y1="64" x2="928" y2="960" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A4C"/>
      <stop offset="0.55" stop-color="#F4502F"/>
      <stop offset="1" stop-color="#D92D4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(300 180) rotate(55) scale(760 620)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ink" x1="512" y1="300" x2="512" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFF1EA"/>
    </linearGradient>
    <filter id="shadow" x="180" y="240" width="664" height="620" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7A1020" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#bg)"/>
  <rect x="64" y="64" width="896" height="896" rx="212" fill="url(#glow)"/>
  <rect x="65.5" y="65.5" width="893" height="893" rx="210.5" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="3"/>

  <!-- the M: a folded front page -->
  <g filter="url(#shadow)">
    <path d="M300 690 V340 L512 572 L724 340 V690" stroke="url(#ink)" stroke-width="112" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the masthead rule and a line of copy -->
  <rect x="244" y="778" width="536" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.92"/>
  <rect x="244" y="834" width="330" height="22" rx="11" fill="#FFFFFF" fill-opacity="0.45"/>
</svg>
