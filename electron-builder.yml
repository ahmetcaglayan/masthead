appId: com.ahmetcaglayan.masthead
productName: Masthead
copyright: Copyright © 2026 Ahmet Çağlayan
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
nsis:
  # One installer per architecture (Masthead-x.y.z-win-x64.exe / -win-arm64.exe), not an extra
  # combined x64+arm64 one twice their size.
  buildUniversalInstaller: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Masthead
  uninstallDisplayName: Masthead
portable:
  artifactName: ${productName}-${version}-portable.${ext}
# Microsoft Store package, built only by .github/workflows/store.yml (`--win appx`). The identity
# comes from Partner Center (product 9PFZD4CRGSQV; "Masthead" alone was taken there). The Store
# signs the package itself, so no certificate is needed. Tiles: build/appx/ (npm run icons).
appx:
  identityName: AHCA.MastheadNews
  publisher: CN=2AF3F876-B6CA-4908-B249-C6DD1C654700
  publisherDisplayName: AHCA
  displayName: Masthead News
  applicationId: Masthead
  backgroundColor: transparent
  languages: [en-US, tr-TR, de-DE, fr-FR, pt-BR, hi-IN]
  # Windows 10 1809: the oldest Partner Center accepts, and older than Electron supports anyway.
  minVersion: 10.0.17763.0
  maxVersionTested: 10.0.26100.0

mac:
  icon: build/icon.png
  category: public.app-category.news
  target:
    - target: dmg
      arch: [arm64, x64]
  # No Developer ID yet: ad-hoc sign ("-"). Unsigned, the bundle electron-builder rewrites
  # keeps Electron's now-broken signature, and Gatekeeper calls a downloaded copy "damaged"
  # with only "Move to Trash"; ad-hoc signed, it can be allowed from Privacy & Security.
  # Ad-hoc signing needs the hardened runtime off (library validation rejects Electron's frameworks).
  hardenedRuntime: false
  identity: '-'
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: News
  maintainer: Ahmet Çağlayan
  target:
    - AppImage
    - deb
appImage:
  # No version in the name: the updater then replaces the file in place, so menu entries,
  # docks and symlinks that point at it keep working after every update.
  artifactName: ${productName}-${os}-${arch}.${ext}

publish:
  provider: github
  owner: ahmetcaglayan
  repo: masthead
