appId: com.ahmetcaglayan.masthead
productName: Masthead
copyright: Copyright © 2026 Ahmet Çağlayan
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - resources/**
  - package.json
  - '!**/*.map'
asarUnpack:
  - resources/**
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
nsis:
  # One installer per architecture (Masthead-x.y.z-win-x64.exe / -win-arm64.exe), not an extra
  # combined x64+arm64 one twice their size.
  buildUniversalInstaller: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Masthead
  uninstallDisplayName: Masthead
portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: build/icon.png
  category: public.app-category.news
  target:
    - target: dmg
      arch: [arm64, x64]
  hardenedRuntime: false
  identity: null
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: build/icon.png
  category: News
  maintainer: Ahmet Çağlayan
  target:
    - AppImage
    - deb

publish:
  provider: github
  owner: ahmetcaglayan
  repo: Masthead
